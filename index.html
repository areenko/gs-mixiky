<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herná Liga - Živé Výsledky</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #0f172a; 
            --surface: #1e293b; 
            --text: #f8fafc; 
            --border: #334155; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }
        h1 { 
            text-align: center; 
            color: #818cf8; 
            margin-bottom: 5px; 
            font-size: 28px;
        }
        .subtitle { 
            text-align: center; 
            color: #64748b; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }
        .card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }
        th, td { 
            padding: 14px 12px; 
            border-bottom: 1px solid var(--border); 
        }
        th { 
            background: #334155; 
            color: #f8fafc;
            font-weight: 600;
        }
        tr:hover {
            background: #24334d;
        }
        .match-item { 
            padding: 12px 0; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .match-item:last-child {
            border-bottom: none;
        }
        .loading { 
            text-align: center; 
            color: #818cf8; 
            font-weight: bold; 
            padding: 40px; 
            font-size: 18px;
        }
        .score-badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Herná Liga - Živá Tabuľka</h1>
    <div class="subtitle">Dáta sa automaticky sťahujú z vašej online Google Tabuľky</div>

    <!-- NAČÍTAVANIE -->
    <div id="loadingMessage" class="loading">⏳ Načítavam a prepočítavam výsledky...</div>

    <div id="mainContent" style="display: none;">
        <!-- TABUĽKA -->
        <div class="card">
            <h2>📊 Aktuálne poradie</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Poz.</th>
                            <th>Hráč / Tím</th>
                            <th>Z</th>
                            <th>V</th>
                            <th>R</th>
                            <th>P</th>
                            <th>Skóre</th>
                            <th>Body</th>
                        </tr>
                    </thead>
                    <tbody id="leagueTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- HISTÓRIA ZÁPASOV -->
        <div class="card">
            <h2>🗓 Odohrané zápasy</h2>
            <div id="matchHistory"></div>
        </div>
    </div>
</div>

<script>
    const SPREADSHEET_ID = '1fOJ-2I-GcSN2aHnyhhbVnwvUOt10ei7Zfn0F6Hb2EBk';
    // Stiahneme čisté CSV, ktoré Google neblokuje
    const URL = `https://google.com{SPREADSHEET_ID}/export?format=csv&gid=0`;

    // Odstránenie diakritiky pre bezpečné porovnávanie názvov stĺpcov
    function removeAccents(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    async function loadData() {
        try {
            const response = await fetch(URL);
            if (!response.ok) throw new Error('Chyba siete');
            const csvText = await response.text();
            
            // Rozdelenie na riadky
            const lines = csvText.split(/\r?\n/);
            if (lines.length < 2) return;

            // Načítanie a vyčistenie hlavičky (1. riadok)
            const headers = lines[0].split(',').map(h => removeAccents(h.replace(/"/g, '')));
            
            // Indexy stĺpcov
            const homeIdx = headers.findIndex(h => h === 'domaci');
            const homeGoalsIdx = headers.findIndex(h => h === 'goly_domaci' || h.includes('goly domaci'));
            const awayIdx = headers.findIndex(h => h === 'hostia');
            const awayGoalsIdx = headers.findIndex(h => h === 'goly_hostia' || h.includes('goly hostia'));

            const stats = {};
            const matches = [];

            // Spracovanie samotných zápasov (od 2. riadku)
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                
                // Rozdelenie riadku podľa čiarok
                const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                
                const home = currentLine[homeIdx];
                const away = currentLine[awayIdx];
                const homeGoals = parseInt(currentLine[homeGoalsIdx]) || 0;
                const awayGoals = parseInt(currentLine[awayGoalsIdx]) || 0;

                if (!home || !away) continue;

                matches.push({ home, away, homeGoals, awayGoals });

                if (!stats[home]) stats[home] = { name: home, z: 0, v: 0, r: 0, p: 0, gf: 0, ga: 0, pts: 0 };
                if (!stats[away]) stats[away] = { name: away, z: 0, v: 0, r: 0, p: 0, gf: 0, ga: 0, pts: 0 };

                stats[home].z++; stats[away].z++;
                stats[home].gf += homeGoals; stats[home].ga += awayGoals;
                stats[away].gf += awayGoals; stats[away].ga += homeGoals;

                if (homeGoals > awayGoals) {
                    stats[home].v++; stats[home].pts += 3; stats[away].p++;
                } else if (homeGoals < awayGoals) {
                    stats[away].v++; stats[away].pts += 3; stats[home].p++;
                } else {
                    stats[home].r++; stats[home].pts += 1; stats[away].r++; stats[away].pts += 1;
                }
            }

            // Zoradenie: Body -> Rozdiel skóre -> Viac strelených gólov
            const sorted = Object.values(stats).sort((a,b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
            
            // Vykreslenie tabuľky
            const tbody = document.getElementById('leagueTableBody');
            tbody.innerHTML = '';
            sorted.forEach((t, i) => {
                tbody.innerHTML += `<tr>
                    <td><strong>${i+1}.</strong></td>
                    <td>${t.name}</td>
                    <td>${t.z}</td>
                    <td>${t.v}</td>
                    <td>${t.r}</td>
                    <td>${t.p}</td>
                    <td>${t.gf}:${t.ga}</td>
                    <td><strong style="color: #818cf8;">${t.pts}</strong></td>
                </tr>`;
            });

            // Vykreslenie histórie
            const historyDiv = document.getElementById('matchHistory');
            historyDiv.innerHTML = matches.length === 0 ? '<p style="color: #64748b; text-align:center;">Žiadne odohrané zápasy.</p>' : '';
            matches.reverse().forEach(m => {
                historyDiv.innerHTML += `<div class="match-item">
                    <span>🎮 <strong>${m.home}</strong> vs. <strong>${m.away}</strong></span>
                    <span class="score-badge">${m.homeGoals} : ${m.awayGoals}</span>
                </div>`;
            });

            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

        } catch (error) {
            console.error(error);
            document.getElementById('loadingMessage').innerHTML = '❌ Nepodarilo sa načítať dáta.<br><small style="color:#64748b;">Uistite sa, že v nastavení tlačidla Zdieľať máte zvolené "Všetci, ktorí majú odkaz".</small>';
        }
    }

    loadData();
</script>
</body>
</html>
