<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herná Liga - Živé Výsledky</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #0f172a; 
            --surface: #1e293b; 
            --text: #f8fafc; 
            --border: #334155; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }
        h1 { 
            text-align: center; 
            color: #818cf8; 
            margin-bottom: 5px; 
            font-size: 28px;
        }
        .subtitle { 
            text-align: center; 
            color: #64748b; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }
        .card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }
        th, td { 
            padding: 14px 12px; 
            border-bottom: 1px solid var(--border); 
        }
        th { 
            background: #334155; 
            color: #f8fafc;
            font-weight: 600;
        }
        tr:hover {
            background: #24334d;
        }
        .match-card {
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .match-card:last-child {
            border-bottom: none;
        }
        .match-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .rosters {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            padding: 6px 10px;
            background: #111827;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .roster-team {
            width: 48%;
        }
        .loading { 
            text-align: center; 
            color: #818cf8; 
            font-weight: bold; 
            padding: 40px; 
            font-size: 18px;
        }
        .score-badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Herná Liga - Živá Tabuľka</h1>
    <div class="subtitle">Dáta sa automaticky sťahujú z vašej online Google Tabuľky</div>

    <!-- REŽIM NAČÍTAVANIA -->
    <div id="loadingMessage" class="loading">⏳ Načítavam a prepočítavam výsledky...</div>

    <div id="mainContent" style="display: none;">
        <!-- TABUĽKA -->
        <div class="card">
            <h2>📊 Poradie</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Poz.</th>
                            <th>Hráč / Tím</th>
                            <th>Z</th>
                            <th>V</th>
                            <th>R</th>
                            <th>P</th>
                            <th>Skóre</th>
                            <th>Body</th>
                        </tr>
                    </thead>
                    <tbody id="leagueTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- HISTÓRIA ZÁPASOV -->
        <div class="card">
            <h2>🗓 Odohrané zápasy</h2>
            <div id="matchHistory"></div>
        </div>
    </div>
</div>

<script>
    // Vaše NOVÉ ID tabuľky z odkazu
    const SPREADSHEET_ID = '1iaPRPJQXMDf03BdyB6DucvpHM6xFJAC6s5y7bgj2tqs';
    
    // Načítavame hárok "Zápasy" (gid=0)
    const url = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:receiveGoogleData&gid=0`;

    function requestData() {
        const script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
            document.getElementById('loadingMessage').innerHTML = '❌ Nepodarilo sa nadviazať spojenie s Google serverom.';
        };
        document.body.appendChild(script);
    }

    // Spracovanie odpovede z Google Sheets
    window.receiveGoogleData = function(response) {
        try {
            if (!response || !response.table || !response.table.rows) {
                throw new Error('Chybné dáta');
            }

            const rows = response.table.rows;
            const stats = {};
            const matches = [];

            rows.forEach(row => {
                // Skontrolujeme, či riadok obsahuje potrebné stĺpce (B, C, D, E)
                if (!row.c || row.c.length < 5 || !row.c[1] || !row.c[2]) return; 

                // Priradenie stĺpcov podľa štruktúry: B=Tím1, C=Tím2, D=Skóre1, E=Skóre2
                const home = String(row.c[1].v).trim();
                const away = String(row.c[2].v).trim();
                
                // Ignorovanie hlavičky
                if (home.toLowerCase() === 'tím 1' || away.toLowerCase() === 'tím 2' || home === '' || away === '') return;

                // Ak skóre zatiaľ nie je zadané (zápas sa neodohral), preskočíme výpočet do tabuľky poradia
                if (row.c[3] === null || row.c[4] === null || row.c[3].v === null || row.c[4].v === null) return;

                const homeGoals = parseInt(row.c[3].v) || 0;
                const awayGoals = parseInt(row.c[4].v) || 0;

                // Načítanie súpisiek zo stĺpcov F (index 5) a G (index 6)
                const homeRoster = row.c[5] && row.c[5].v ? String(row.c[5].v).trim() : '';
                const awayRoster = row.c[6] && row.c[6].v ? String(row.c[6].v).trim() : '';

                matches.push({ home, away, homeGoals, awayGoals, homeRoster, awayRoster });

                if (!stats[home]) stats[home] = { name: home, z: 0, v: 0, r: 0, p: 0, gf: 0, ga: 0, pts: 0 };
                if (!stats[away]) stats[away] = { name: away, z: 0, v: 0, r: 0, p: 0, gf: 0, ga: 0, pts: 0 };

                stats[home].z++; stats[away].z++;
                stats[home].gf += homeGoals; stats[home].ga += awayGoals;
                stats[away].gf += awayGoals; stats[away].ga += homeGoals;

                if (homeGoals > awayGoals) {
                    stats[home].v++; stats[home].pts += 3; stats[away].p++;
                } else if (homeGoals < awayGoals) {
                    stats[away].v++; stats[away].pts += 3; stats[home].p++;
                } else {
                    stats[home].r++; stats[home].pts += 1; stats[away].r++; stats[away].pts += 1;
                }
            });

            // Zoradenie tabuľky poradia
            const sorted = Object.values(stats).sort((a,b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
            
            // Vykreslenie Tabuľky poradia
            const tbody = document.getElementById('leagueTableBody');
            tbody.innerHTML = '';
            sorted.forEach((t, i) => {
                tbody.innerHTML += `<tr>
                    <td><strong>${i+1}.</strong></td>
                    <td>${t.name}</td>
                    <td>${t.z}</td>
                    <td>${t.v}</td>
                    <td>${t.r}</td>
                    <td>${t.p}</td>
                    <td>${t.gf}:${t.ga}</td>
                    <td><strong style="color: #818cf8;">${t.pts}</strong></td>
                </tr>`;
            });

            // Vykreslenie Zoznamu Zápasov so súpiskami
            const historyDiv = document.getElementById('matchHistory');
            historyDiv.innerHTML = matches.length === 0 ? '<p style="color: #64748b; text-align:center;">Zatiaľ neboli odohrané žiadne zápasy.</p>' : '';
            
            matches.reverse().forEach(m => {
                // Súpisky zobrazíme iba vtedy, ak je aspoň jedna z nich vyplnená
                const hasRosters = m.homeRoster || m.awayRoster;
                const rosterHtml = hasRosters ? `
                    <div class="rosters">
                        <div class="roster-team">🏃‍♂️ ${m.homeRoster || 'Nie je zadaná'}</div>
                        <div class="roster-team" style="text-align: right;">🏃‍♂️ ${m.awayRoster || 'Nie je zadaná'}</div>
                    </div>
                ` : '';

                historyDiv.innerHTML += `
                    <div class="match-card">
                        <div class="match-item">
                            <span>🎮 <strong>${m.home}</strong> vs. <strong>${m.away}</strong></span>
                            <span class="score-badge">${m.homeGoals} : ${m.awayGoals}</span>
                        </div>
                        ${rosterHtml}
                    </div>
                `;
            });

            // Prepnúť na zobrazenie hotového obsahu
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

        } catch (e) {
            console.error(e);
            document.getElementById('loadingMessage').innerText = '❌ Chyba pri spracovaní dát z tabuľky.';
        }
    };

    // Spustenie
    requestData();
</script>
</body>
</html>
